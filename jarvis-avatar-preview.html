<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Avatar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .avatar-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring-outer {
            position: absolute;
            width: 280px;
            height: 280px;
            border: 1px dashed rgba(0, 212, 255, 0.6);
            border-radius: 50%;
            animation: rotate 8s linear infinite, breatheSlow 4s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .ring-middle {
            position: absolute;
            width: 240px;
            height: 240px;
            border: 2px dashed rgba(0, 168, 204, 0.8);
            border-radius: 50%;
            animation: rotateReverse 6s linear infinite, breatheMedium 3s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .ring-inner {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 50%;
            animation: breatheFast 2.5s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .core-bg {
            position: absolute;
            width: 160px;
            height: 160px;
            background: rgba(0, 212, 255, 0.05);
            border: 2px solid rgba(0, 212, 255, 0.8);
            border-radius: 50%;
            animation: breathe 3s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .core-reactor {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(0, 212, 255, 0.15);
            border: 2px solid #00ffff;
            border-radius: 50%;
            animation: breatheMedium 2s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .core-center {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #00ffff;
            border-radius: 50%;
            animation: glow 3s ease-in-out infinite, breatheFast 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 60px #00d4ff;
            transition: all 0.3s ease;
        }

        .scan-line {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #00ffff;
            opacity: 0;
            animation: rotate 2s linear infinite, fadeInOut 2s ease-in-out infinite;
        }

        .scan-line.active {
            opacity: 0.8;
        }

        .data-point {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #00d4ff;
            border-radius: 50%;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .data-point:nth-child(1) {
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .data-point:nth-child(2) {
            top: 25%;
            right: 25px;
        }

        .data-point:nth-child(3) {
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
        }

        .data-point:nth-child(4) {
            bottom: 25%;
            right: 25px;
        }

        .data-point:nth-child(5) {
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .data-point:nth-child(6) {
            bottom: 25%;
            left: 25px;
        }

        .data-point:nth-child(7) {
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
        }

        .data-point:nth-child(8) {
            top: 25%;
            left: 25px;
        }

        .status-indicator {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00d4ff;
            transition: all 0.3s ease;
        }

        .status-indicator.top {
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
        }

        .status-indicator.right {
            top: 50%;
            right: 25px;
            transform: translateY(-50%);
        }

        .status-indicator.bottom {
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
        }

        .status-indicator.left {
            top: 50%;
            left: 25px;
            transform: translateY(-50%);
        }

        .glow {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: breatheGlow 4s ease-in-out infinite;
            z-index: -1;
            transition: all 0.3s ease;
        }

        .status-text {
            color: #00d4ff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-top: 20px;
            text-shadow: 0 0 10px #00d4ff;
            transition: all 0.3s ease;
        }

        .state-buttons {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .state-btn {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid #00d4ff;
            color: #00d4ff;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .state-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .state-btn.active {
            background: rgba(0, 212, 255, 0.3);
            border-color: #00ffff;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotateReverse {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        @keyframes breatheSlow {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.03);
                opacity: 0.9;
            }
        }

        @keyframes breatheMedium {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        @keyframes breatheFast {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.06);
                opacity: 1;
            }
        }

        @keyframes breatheGlow {

            0%,
            100% {
                opacity: 0.15;
                transform: scale(1);
            }

            50% {
                opacity: 0.35;
                transform: scale(1.1);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            70% {
                transform: scale(1.15);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes popRing {
            0% {
                transform: scale(0.8);
                opacity: 1;
                border-width: 4px;
            }

            100% {
                transform: scale(1.5);
                opacity: 0;
                border-width: 1px;
            }
        }

        @keyframes ripple {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }

            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        @keyframes coreFlash {
            0% {
                box-shadow: 0 0 0px currentColor;
            }

            50% {
                box-shadow: 0 0 80px currentColor, 0 0 120px currentColor;
            }

            100% {
                box-shadow: 0 0 20px currentColor;
            }
        }

        .avatar-wrapper.pop-active {
            animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        .ripple-effect {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #00d4ff;
            animation: ripple 0.6s ease-out forwards;
            pointer-events: none;
        }

        .ring-pop {
            position: absolute;
            border-radius: 50%;
            border: 2px solid #00d4ff;
            animation: popRing 0.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes glow {

            0%,
            100% {
                opacity: 0.5;
                box-shadow: 0 0 20px #00ffff;
            }

            50% {
                opacity: 1;
                box-shadow: 0 0 40px #00ffff, 0 0 60px #00d4ff;
            }
        }

        @keyframes glowPulse {

            0%,
            100% {
                opacity: 0.2;
            }

            50% {
                opacity: 0.4;
            }
        }

        @keyframes fadeInOut {

            0%,
            100% {
                opacity: 0;
            }

            50% {
                opacity: 0.8;
            }
        }

        /* IDLE - Slow breathing, calm */
        .idle .ring-outer {
            animation: rotate 12s linear infinite, breatheSlow 4s ease-in-out infinite;
        }

        .idle .ring-middle {
            animation: rotateReverse 10s linear infinite, breatheMedium 3.5s ease-in-out infinite;
        }

        .idle .ring-inner {
            animation: breatheFast 3s ease-in-out infinite;
        }

        .idle .core-bg {
            animation: breathe 4s ease-in-out infinite;
        }

        .idle .core-reactor {
            animation: breatheMedium 3s ease-in-out infinite;
        }

        .idle .core-center {
            animation: glowIdle 4s ease-in-out infinite;
        }

        .idle .glow {
            animation: breatheGlow 5s ease-in-out infinite;
        }

        @keyframes glowIdle {

            0%,
            100% {
                opacity: 0.4;
                box-shadow: 0 0 15px #00d4ff, 0 0 30px #00d4ff;
            }

            50% {
                opacity: 0.8;
                box-shadow: 0 0 25px #00ffff, 0 0 50px #00d4ff;
            }
        }

        /* LISTENING - Active scanning, alert */
        .listening .ring-outer {
            animation: rotate 3s linear infinite, breatheSlow 2s ease-in-out infinite;
        }

        .listening .ring-middle {
            animation: rotateReverse 2s linear infinite, breatheMedium 1.5s ease-in-out infinite;
        }

        .listening .ring-inner {
            animation: breatheFast 1s ease-in-out infinite, pulseRing 0.8s ease-in-out infinite;
        }

        .listening .core-bg {
            animation: breathe 1.5s ease-in-out infinite;
        }

        .listening .core-reactor {
            animation: breatheMedium 1s ease-in-out infinite;
        }

        .listening .core-center {
            animation: glowListening 0.8s ease-in-out infinite;
        }

        .listening .glow {
            animation: breatheGlow 1.5s ease-in-out infinite;
        }

        .listening .scan-line {
            animation: rotate 1.5s linear infinite;
            opacity: 0.9;
        }

        .listening .data-point {
            animation: dataPulse 0.6s ease-in-out infinite;
        }

        @keyframes glowListening {

            0%,
            100% {
                opacity: 0.6;
                box-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88;
            }

            50% {
                opacity: 1;
                box-shadow: 0 0 40px #00ff88, 0 0 80px #00ff88, 0 0 120px #00cc6a;
            }
        }

        @keyframes pulseRing {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        @keyframes dataPulse {

            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        /* THINKING - Spinning, calculating */
        .thinking .ring-outer {
            animation: rotate 1.5s linear infinite, breatheSlow 1s ease-in-out infinite;
        }

        .thinking .ring-middle {
            animation: rotateReverse 1s linear infinite, breatheMedium 0.8s ease-in-out infinite;
        }

        .thinking .ring-inner {
            animation: rotate 2s linear infinite, breatheFast 0.6s ease-in-out infinite;
        }

        .thinking .core-bg {
            animation: pulse 0.4s ease-in-out infinite, rotate 3s linear infinite;
        }

        .thinking .core-reactor {
            animation: breatheMedium 0.5s ease-in-out infinite, rotateReverse 2s linear infinite;
        }

        .thinking .core-center {
            animation: glowThinking 0.5s ease-in-out infinite;
        }

        .thinking .glow {
            animation: breatheGlow 0.8s ease-in-out infinite;
        }

        .thinking .data-point {
            animation: thinkingDot 0.4s ease-in-out infinite;
        }

        @keyframes glowThinking {

            0%,
            100% {
                opacity: 0.7;
                box-shadow: 0 0 25px #ffaa00, 0 0 50px #ffaa00;
                transform: scale(1);
            }

            25% {
                transform: scale(1.1);
            }

            50% {
                opacity: 1;
                box-shadow: 0 0 50px #ffaa00, 0 0 100px #ffaa00, 0 0 150px #cc8800;
                transform: scale(0.95);
            }

            75% {
                transform: scale(1.05);
            }
        }

        @keyframes thinkingDot {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.8);
            }
        }

        /* SPEAKING - Waveform, rhythmic */
        .speaking .ring-outer {
            animation: rotate 6s linear infinite, breatheSlow 2s ease-in-out infinite;
        }

        .speaking .ring-middle {
            animation: rotateReverse 4s linear infinite, breatheMedium 1.5s ease-in-out infinite;
        }

        .speaking .ring-inner {
            animation: breatheFast 1s ease-in-out infinite;
        }

        .speaking .core-bg {
            animation: breathe 1.2s ease-in-out infinite;
        }

        .speaking .core-reactor {
            animation: breatheMedium 0.8s ease-in-out infinite;
        }

        .speaking .core-center {
            animation: glowSpeaking 0.6s ease-in-out infinite;
        }

        .speaking .glow {
            animation: breatheGlowSpeaking 0.8s ease-in-out infinite;
        }

        .speaking .data-point {
            animation: speakingDot 0.5s ease-in-out infinite;
        }

        .speaking .ring-outer.word-pulse {
            animation: wordPulseOuter 0.3s ease-out;
        }

        .speaking .ring-middle.word-pulse {
            animation: wordPulseMiddle 0.3s ease-out;
        }

        .speaking .ring-inner.word-pulse {
            animation: wordPulseInner 0.3s ease-out;
        }

        .speaking .core-bg.word-pulse {
            animation: wordPulseCore 0.3s ease-out;
        }

        .speaking .core-reactor.word-pulse {
            animation: wordPulseReactor 0.3s ease-out;
        }

        .speaking .core-center.word-pulse {
            animation: wordPulseCenter 0.3s ease-out;
        }

        .speaking .glow.word-pulse {
            animation: wordPulseGlow 0.3s ease-out;
        }

        @keyframes wordPulseOuter {
            0% {
                transform: scale(1);
                border-color: rgba(0, 255, 255, 0.6);
            }

            50% {
                transform: scale(1.05);
                border-color: rgba(0, 255, 255, 1);
            }

            100% {
                transform: scale(1);
                border-color: rgba(0, 255, 255, 0.6);
            }
        }

        @keyframes wordPulseMiddle {
            0% {
                transform: scale(1);
                border-color: rgba(0, 255, 255, 0.8);
            }

            50% {
                transform: scale(1.08);
                border-color: rgba(0, 255, 255, 1);
            }

            100% {
                transform: scale(1);
                border-color: rgba(0, 255, 255, 0.8);
            }
        }

        @keyframes wordPulseInner {
            0% {
                transform: scale(1);
                border-color: rgba(0, 255, 255, 0.4);
            }

            50% {
                transform: scale(1.12);
                border-color: rgba(0, 255, 255, 0.9);
            }

            100% {
                transform: scale(1);
                border-color: rgba(0, 255, 255, 0.4);
            }
        }

        @keyframes wordPulseCore {
            0% {
                transform: scale(1);
                background: rgba(0, 255, 255, 0.05);
            }

            50% {
                transform: scale(1.15);
                background: rgba(0, 255, 255, 0.15);
            }

            100% {
                transform: scale(1);
                background: rgba(0, 255, 255, 0.05);
            }
        }

        @keyframes wordPulseReactor {
            0% {
                transform: scale(1);
                background: rgba(0, 255, 255, 0.15);
            }

            50% {
                transform: scale(1.2);
                background: rgba(0, 255, 255, 0.3);
            }

            100% {
                transform: scale(1);
                background: rgba(0, 255, 255, 0.15);
            }
        }

        @keyframes wordPulseCenter {
            0% {
                transform: scale(1);
                box-shadow: 0 0 20px #00ffff;
            }

            50% {
                transform: scale(1.3);
                box-shadow: 0 0 50px #00ffff, 0 0 100px #00ffff;
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 20px #00ffff;
            }
        }

        @keyframes wordPulseGlow {
            0% {
                transform: scale(1);
                opacity: 0.2;
            }

            50% {
                transform: scale(1.3);
                opacity: 0.6;
            }

            100% {
                transform: scale(1);
                opacity: 0.2;
            }
        }

        @keyframes glowSpeaking {

            0%,
            100% {
                opacity: 0.5;
                box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            }

            50% {
                opacity: 1;
                box-shadow: 0 0 50px #00ffff, 0 0 100px #00ffff, 0 0 150px #00cccc;
            }
        }

        @keyframes breatheGlowSpeaking {

            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.15);
            }
        }

        @keyframes waveExpand {

            0%,
            100% {
                transform: scale(1);
                border-color: rgba(0, 255, 255, 0.4);
            }

            50% {
                transform: scale(1.08);
                border-color: rgba(0, 255, 255, 0.8);
            }
        }

        @keyframes speakingDot {

            0%,
            100% {
                opacity: 0.5;
                transform: scale(1) translateY(0);
            }

            25% {
                transform: scale(1.3) translateY(-3px);
            }

            75% {
                transform: scale(1.3) translateY(3px);
            }
        }

        .word-display {
            position: absolute;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ffff;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        .word-display.visible {
            opacity: 1;
        }

        /* ERROR - Warning, flashing, urgent */
        .error .ring-outer {
            animation: errorRotate 0.2s linear infinite, errorShake 0.1s linear infinite;
        }

        .error .ring-middle {
            animation: errorRotateReverse 0.15s linear infinite, errorShake 0.1s linear infinite;
        }

        .error .ring-inner {
            animation: errorFlash 0.2s ease-in-out infinite;
        }

        .error .core-bg {
            animation: errorFlash 0.15s ease-in-out infinite;
        }

        .error .core-reactor {
            animation: errorFlash 0.2s ease-in-out infinite;
        }

        .error .core-center {
            animation: glowError 0.3s ease-in-out infinite;
        }

        .error .glow {
            animation: glowErrorPulse 0.4s ease-in-out infinite;
        }

        .error .data-point {
            animation: errorDot 0.2s ease-in-out infinite;
        }

        @keyframes errorRotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes errorRotateReverse {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        @keyframes errorShake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-2px);
            }

            75% {
                transform: translateX(2px);
            }
        }

        @keyframes errorFlash {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        @keyframes glowError {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 30px #ff4444, 0 0 60px #ff4444;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                box-shadow: 0 0 80px #ff4444, 0 0 120px #ff4444, 0 0 180px #cc0000;
                transform: scale(1.2);
            }
        }

        @keyframes glowErrorPulse {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.2);
            }
        }

        @keyframes errorDot {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.2;
                transform: scale(2);
            }
        }

        /* State Colors */
        .idle .ring-outer {
            border-color: rgba(0, 212, 255, 0.6);
        }

        .idle .ring-middle {
            border-color: rgba(0, 168, 204, 0.8);
        }

        .idle .ring-inner {
            border-color: rgba(0, 212, 255, 0.4);
        }

        .idle .core-bg {
            background: rgba(0, 212, 255, 0.05);
            border-color: rgba(0, 212, 255, 0.8);
        }

        .idle .core-reactor {
            background: rgba(0, 212, 255, 0.15);
            border-color: #00ffff;
        }

        .idle .core-center {
            background: #00ffff;
        }

        .idle .glow {
            background: radial-gradient(circle, rgba(0, 212, 255, 0.3) 0%, transparent 70%);
        }

        .idle .data-point {
            background: #00d4ff;
        }

        .idle .status-indicator {
            background: #00d4ff;
        }

        .idle .status-text {
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff;
        }

        .listening .ring-outer {
            border-color: rgba(0, 255, 136, 0.6);
        }

        .listening .ring-middle {
            border-color: rgba(0, 255, 136, 0.8);
        }

        .listening .ring-inner {
            border-color: rgba(0, 255, 136, 0.4);
        }

        .listening .core-bg {
            background: rgba(0, 255, 136, 0.05);
            border-color: rgba(0, 255, 136, 0.8);
        }

        .listening .core-reactor {
            background: rgba(0, 255, 136, 0.15);
            border-color: #00ff88;
        }

        .listening .core-center {
            background: #00ff88;
        }

        .listening .glow {
            background: radial-gradient(circle, rgba(0, 255, 136, 0.3) 0%, transparent 70%);
        }

        .listening .scan-line {
            border-top-color: #00ff88;
        }

        .listening .data-point {
            background: #00ff88;
        }

        .listening .status-indicator {
            background: #00ff88;
        }

        .listening .status-text {
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
        }

        .thinking .ring-outer {
            border-color: rgba(255, 170, 0, 0.6);
        }

        .thinking .ring-middle {
            border-color: rgba(255, 170, 0, 0.8);
        }

        .thinking .ring-inner {
            border-color: rgba(255, 170, 0, 0.4);
        }

        .thinking .core-bg {
            background: rgba(255, 170, 0, 0.05);
            border-color: rgba(255, 170, 0, 0.8);
        }

        .thinking .core-reactor {
            background: rgba(255, 170, 0, 0.15);
            border-color: #ffaa00;
        }

        .thinking .core-center {
            background: #ffaa00;
        }

        .thinking .glow {
            background: radial-gradient(circle, rgba(255, 170, 0, 0.3) 0%, transparent 70%);
        }

        .thinking .data-point {
            background: #ffaa00;
        }

        .thinking .status-indicator {
            background: #ffaa00;
        }

        .thinking .status-text {
            color: #ffaa00;
            text-shadow: 0 0 10px #ffaa00;
        }

        .speaking .ring-outer {
            border-color: rgba(0, 255, 255, 0.6);
        }

        .speaking .ring-middle {
            border-color: rgba(0, 255, 255, 0.8);
        }

        .speaking .ring-inner {
            border-color: rgba(0, 255, 255, 0.4);
        }

        .speaking .core-bg {
            background: rgba(0, 255, 255, 0.05);
            border-color: rgba(0, 255, 255, 0.8);
        }

        .speaking .core-reactor {
            background: rgba(0, 255, 255, 0.15);
            border-color: #00ffff;
        }

        .speaking .core-center {
            background: #00ffff;
        }

        .speaking .glow {
            background: radial-gradient(circle, rgba(0, 255, 255, 0.3) 0%, transparent 70%);
        }

        .speaking .data-point {
            background: #00ffff;
        }

        .speaking .status-indicator {
            background: #00ffff;
        }

        .speaking .status-text {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .error .ring-outer {
            border-color: rgba(255, 68, 68, 0.6);
        }

        .error .ring-middle {
            border-color: rgba(255, 68, 68, 0.8);
        }

        .error .ring-inner {
            border-color: rgba(255, 68, 68, 0.4);
        }

        .error .core-bg {
            background: rgba(255, 68, 68, 0.15);
            border-color: rgba(255, 68, 68, 0.9);
        }

        .error .core-reactor {
            background: rgba(255, 68, 68, 0.3);
            border-color: #ff4444;
        }

        .error .core-center {
            background: #ff4444;
        }

        .error .glow {
            background: radial-gradient(circle, rgba(255, 68, 68, 0.4) 0%, transparent 70%);
        }

        .error .data-point {
            background: #ff4444;
        }

        .error .status-indicator {
            background: #ff4444;
        }

        .error .status-text {
            color: #ff4444;
            text-shadow: 0 0 10px #ff4444;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="avatar-wrapper" id="avatar">
            <div class="glow"></div>
            <div class="ring-outer"></div>
            <div class="ring-middle"></div>
            <div class="ring-inner"></div>
            <div class="core-bg"></div>
            <div class="core-reactor"></div>
            <div class="core-center"></div>
            <div class="scan-line"></div>
            <div class="data-point"></div>
            <div class="data-point"></div>
            <div class="data-point"></div>
            <div class="data-point"></div>
            <div class="data-point"></div>
            <div class="data-point"></div>
            <div class="data-point"></div>
            <div class="data-point"></div>
            <div class="status-indicator top"></div>
            <div class="status-indicator right"></div>
            <div class="status-indicator bottom"></div>
            <div class="status-indicator left"></div>
        </div>

        <div class="word-display" id="wordDisplay"></div>

        <div class="status-text" id="statusText">STANDBY</div>

        <div class="state-buttons">
            <button class="state-btn active" onclick="setState('idle')">IDLE</button>
            <button class="state-btn" onclick="setState('listening')">LISTENING</button>
            <button class="state-btn" onclick="setState('thinking')">THINKING</button>
            <button class="state-btn" onclick="demoSpeaking()">SPEAKING</button>
            <button class="state-btn" onclick="setState('error')">ERROR</button>
        </div>
    </div>

    <script>
        let errorTimeout = null;
        let speakInterval = null;

        function setState(state) {
            const avatar = document.getElementById('avatar');
            const wrapper = document.querySelector('.avatar-wrapper');
            const statusText = document.getElementById('statusText');
            const buttons = document.querySelectorAll('.state-btn');

            if (errorTimeout) {
                clearTimeout(errorTimeout);
                errorTimeout = null;
            }

            if (speakInterval) {
                clearInterval(speakInterval);
                speakInterval = null;
            }

            wrapper.classList.remove('pop-active');
            document.querySelectorAll('.ripple-effect, .ring-pop').forEach(el => el.remove());

            void wrapper.offsetWidth;
            wrapper.classList.add('pop-active');

            createRipple(state);
            createRingPops(state);

            avatar.classList.remove('listening', 'thinking', 'speaking', 'error');

            if (state !== 'idle') {
                avatar.classList.add(state);
            }

            const statusMap = {
                'idle': 'STANDBY',
                'listening': 'LISTENING',
                'thinking': 'PROCESSING',
                'speaking': 'SPEAKING',
                'error': 'ERROR'
            };
            statusText.textContent = statusMap[state];

            buttons.forEach((btn, index) => {
                const states = ['idle', 'listening', 'thinking', 'speaking', 'error'];
                btn.classList.toggle('active', states[index] === state);
            });

            if (state === 'error') {
                errorTimeout = setTimeout(() => {
                    setState('idle');
                }, 1500);
            }
        }

        function speakWord(word) {
            const avatar = document.getElementById('avatar');
            const wordDisplay = document.getElementById('wordDisplay');
            const elements = ['ring-outer', 'ring-middle', 'ring-inner', 'core-bg', 'core-reactor', 'core-center', 'glow'];

            if (!avatar.classList.contains('speaking')) {
                setState('speaking');
            }

            elements.forEach(el => {
                const elem = avatar.querySelector('.' + el);
                if (elem) {
                    elem.classList.remove('word-pulse');
                    void elem.offsetWidth;
                    elem.classList.add('word-pulse');
                    setTimeout(() => elem.classList.remove('word-pulse'), 300);
                }
            });

            wordDisplay.textContent = word;
            wordDisplay.classList.add('visible');
            setTimeout(() => {
                wordDisplay.classList.remove('visible');
            }, 400);
        }

        function demoSpeaking() {
            const words = ['Hello', 'I', 'am', 'Jarvis', 'your', 'personal', 'AI', 'assistant', 'How', 'can', 'I', 'help', 'you', 'today'];
            let i = 0;

            setState('speaking');

            speakInterval = setInterval(() => {
                if (i < words.length) {
                    speakWord(words[i]);
                    i++;
                } else {
                    clearInterval(speakInterval);
                    speakInterval = null;
                    setTimeout(() => setState('idle'), 500);
                }
            }, 350);
        }

        function createRipple(state) {
            const wrapper = document.querySelector('.avatar-wrapper');
            const colors = {
                'idle': '#00d4ff',
                'listening': '#00ff88',
                'thinking': '#ffaa00',
                'speaking': '#00ffff',
                'error': '#ff4444'
            };

            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const ripple = document.createElement('div');
                    ripple.className = 'ripple-effect';
                    ripple.style.borderColor = colors[state];
                    ripple.style.left = '50%';
                    ripple.style.top = '50%';
                    ripple.style.marginLeft = '-50px';
                    ripple.style.marginTop = '-50px';
                    wrapper.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 600);
                }, i * 100);
            }
        }

        function createRingPops(state) {
            const wrapper = document.querySelector('.avatar-wrapper');
            const colors = {
                'idle': '#00d4ff',
                'listening': '#00ff88',
                'thinking': '#ffaa00',
                'speaking': '#00ffff',
                'error': '#ff4444'
            };

            const sizes = [120, 160, 200, 240, 280];

            sizes.forEach((size, i) => {
                setTimeout(() => {
                    const ring = document.createElement('div');
                    ring.className = 'ring-pop';
                    ring.style.width = size + 'px';
                    ring.style.height = size + 'px';
                    ring.style.left = '50%';
                    ring.style.top = '50%';
                    ring.style.marginLeft = -(size / 2) + 'px';
                    ring.style.marginTop = -(size / 2) + 'px';
                    ring.style.borderColor = colors[state];
                    wrapper.appendChild(ring);
                    setTimeout(() => ring.remove(), 500);
                }, i * 80);
            });
        }
    </script>
</body>

</html>
